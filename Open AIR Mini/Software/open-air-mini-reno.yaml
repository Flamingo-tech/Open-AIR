esphome:
  name: open-air-mini-reno
  friendly_name: Open AIR Mini Reno
esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

# Optional Web Server (comment out to disable)
web_server:
  port: 80

# Enable Home Assistant API
api:

ota:
  password: "9f2ab9aa715f573e2476e75a5ec7f4e7"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case Wi-Fi connection fails
  ap:
    ssid: Open-AIR-Mini-Reno Fallback
    password: "ChangeMe@123!"

captive_portal:

globals:
  # Disconnected Mode Max Fan Speed, linked to Disconnected Hum Level Max Speed
  - id: disconnected_max_fan_speed
    type: int
    restore_value: no
    initial_value: "100"
  # Disconnected Mode Medium Fan Speed, linked to Disconnected Hum Level Medium Speed
  - id: disconnected_medium_fan_speed
    type: int
    restore_value: no
    initial_value: "60"
  # Disconnected Mode Default Fan Speed, for humidities lower than Disconnected Hum Level Medium Speed
  # or if NOT using a humidity sensor. Without sensor this speed will be maintained untill a connection
  # to Home Assistant has been restored and your automations can take over.
  - id: disconnected_default_fan_speed
    type: int
    restore_value: no
    initial_value: "25"
  # Disconnected Mode Max Fan Speed Threshold    
  - id: disconnected_hum_level_max_speed
    type: int
    restore_value: no
    initial_value: "75"
  # Disconnected Mode Medium Fan Speed Threshold
  - id: disconnected_hum_level_medium_speed
    type: int
    restore_value: no
    initial_value: "55"

# Status LED (GPIO14)
status_led:
  pin:
    number: GPIO14
    inverted: true

# I2C Busses: Bus B is used for the built-in SHT40 sensor
i2c:
  - id: bus_a
    sda: GPIO13
    scl: GPIO4
    scan: true
  - id: bus_b
    sda: GPIO33
    scl: GPIO32
    scan: true

# Motor control (PWM on GPIO16)
output:
  - platform: ledc
    pin: GPIO16
    id: motor_pwm
    frequency: 1000 Hz
    inverted: true
    min_power: 0.15
    zero_means_zero: true

# Fan entity in Home Assistant
fan:
  - platform: speed
    output: motor_pwm
    name: "Mechanical Ventilation"
    id: ducobox_fan
    restore_mode: RESTORE_DEFAULT_OFF

# Physical 3-position switch (Perilex L2 and L3)
binary_sensor:
  - platform: gpio
    id: switch_pos_2
    name: "Switch Position 2 (Medium)"
    pin:
      number: GPIO35
      mode:
        input: true
    filters:
      - delayed_on_off: 100ms
    on_press:
      then:
        - fan.turn_on:
            id: ducobox_fan
            speed: 55
    on_release:
      then:
        - if:
            condition:
              binary_sensor.is_off: switch_pos_3
            then:
              - fan.turn_on:
                  id: ducobox_fan
                  speed: 25

  - platform: gpio
    id: switch_pos_3
    name: "Switch Position 3 (High)"
    pin:
      number: GPIO36
      mode:
        input: true
    filters:
      - delayed_on_off: 100ms
    on_press:
      then:
        - fan.turn_on:
            id: ducobox_fan
            speed: 100
    on_release:
      then:
        - if:
            condition:
              binary_sensor.is_off: switch_pos_2
            then:
              - fan.turn_on:
                  id: ducobox_fan
                  speed: 25

# Human-readable physical switch state in Home Assistant
text_sensor:
  - platform: template
    name: "Physical Switch Position"
    icon: "mdi:fan-speed-2"
    update_interval: 1s
    lambda: |-
      if (id(switch_pos_3).state) {
        return {"Position 3 (High)"};
      } else if (id(switch_pos_2).state) {
        return {"Position 2 (Medium)"};
      } else {
        return {"Position 1 (Low)"};
      }

# Sensors: Tacho (RPM) and SHT40 (Temperature & Humidity)
sensor:
  - platform: pulse_counter
    pin:
      number: GPIO34
      mode:
        input: true
    name: "Fan RPM"
    unit_of_measurement: "RPM"
    icon: "mdi:fan"
    update_interval: 10s
    filters:
      # Standard Duco/ebm-papst motors output 2 pulses per revolution
      - multiply: 0.5

  - platform: sht4x
    i2c_id: bus_b
    temperature:
      name: "Exhaust Temperature"
      filters:
        - offset: -1.5
    humidity:
      name: "Exhaust Humidity"
    update_interval: 15s

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

script:
  # Below includes for disconnected mode are mutually exclusive. Only use one at a time!
  !include disconnected-mode-without-humidity.yaml
  # !include disconnected-mode-with-humidity.yaml

interval:
  - interval: 30s
    then:
      - logger.log: "API Connectivity Check for Disconnected Mode"
      - if:
          condition:
            not:
              api.connected:
          then:
            - logger.log: "API disconnected"
            - script.execute: disconnected_mode
          else:
            - logger.log: "API connected"
            - script.stop: disconnected_mode
